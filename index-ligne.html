<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Galerie Mosaïque</title>
    <style>
        :root {
            /* PARAMÈTRE : Nombre d'images visibles à l'écran */
            --imgs-per-view: 5;
            --gap: 10px;
            --bg-color: #121212;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: sans-serif;
            overflow: hidden; /* Empêche le scroll vertical global */
        }

        /* --- CONTENEUR MOSAÏQUE --- */
        .gallery-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            height: 100vh;
            padding: 0 50px;
        }

        .mosaic-container {
            display: flex;
            gap: var(--gap);
            overflow-x: auto;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            padding: 20px 0;
            scrollbar-width: none; /* Cache la scrollbar (Firefox) */
        }

        .mosaic-container::-webkit-scrollbar {
            display: none; /* Cache la scrollbar (Chrome/Safari) */
        }

        .mosaic-item {
            /* Calcul de la taille basé sur le paramètre */
            flex: 0 0 calc((100% / var(--imgs-per-view)) - (var(--gap) * (var(--imgs-per-view) - 1) / var(--imgs-per-view)));
            aspect-ratio: 1 / 1;
            scroll-snap-align: start;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 4px;
            overflow: hidden;
        }

        .mosaic-item:hover {
            transform: scale(1.02);
        }

        .mosaic-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Force le carré sans déformer */
            display: block;
        }

        /* --- BOUTONS DE NAVIGATION --- */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 2rem;
            padding: 20px 15px;
            cursor: pointer;
            z-index: 10;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-btn:hover { background: rgba(255, 255, 255, 0.5); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* --- LIGHTBOX (AFFICHE EN GRAND) --- */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none; /* Caché par défaut */
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: zoom-out;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: default;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) { :root { --imgs-per-view: 3; } }
        @media (max-width: 600px) { :root { --imgs-per-view: 2; } }
    </style>
</head>
<body>

    <div class="gallery-wrapper">
        <button class="nav-btn prev-btn" onclick="scrollGal(-1)">❮</button>
        
        <div class="mosaic-container" id="gallery">
            <!-- Les images seront insérées ici par JS -->
        </div>

        <button class="nav-btn next-btn" onclick="scrollGal(1)">❯</button>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="closeLightbox(event)">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // 1. Charger les images depuis le JSON
        async function loadGallery() {
            try {
                const response = await fetch('images.json');
                const images = await response.json();

                images.forEach(imgName => {
                    const item = document.createElement('div');
                    item.className = 'mosaic-item';
                    
                    const img = document.createElement('img');
                    // Utilisation de loading="lazy" pour la performance (1000 images)
                    img.src = `images/${imgName}`;
                    img.loading = "lazy"; 
                    img.alt = imgName;

                    item.onclick = () => openLightbox(`images/${imgName}`);
                    
                    item.appendChild(img);
                    gallery.appendChild(item);
                });
            } catch (error) {
                console.error("Erreur lors du chargement du JSON :", error);
                gallery.innerHTML = "<p>Erreur de chargement des images. Assurez-vous de lancer un serveur local (Live Server).</p>";
            }
        }

        // 2. Gestion du Scroll (Boutons)
        function scrollGal(direction) {
            const scrollAmount = gallery.clientWidth / 2;
            gallery.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }

        // 3. Gestion Lightbox
        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox(event) {
            // Ferme si on clique sur le fond ou sur la croix, mais pas sur l'image elle-même
            if (event.target !== lightboxImg) {
                lightbox.style.display = 'none';
                lightboxImg.src = "";
            }
        }

        // 4. Support du swipe (tactile) basique
        let isDown = false;
        let startX;
        let scrollLeft;

        gallery.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - gallery.offsetLeft;
            scrollLeft = gallery.scrollLeft;
        });
        gallery.addEventListener('mouseleave', () => isDown = false);
        gallery.addEventListener('mouseup', () => isDown = false);
        gallery.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - gallery.offsetLeft;
            const walk = (x - startX) * 2;
            gallery.scrollLeft = scrollLeft - walk;
        });

        // Lancer le chargement
        loadGallery();
    </script>
</body>
</html>
