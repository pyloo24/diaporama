<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galerie Mosaïque</title>
    <style>
        :root {
            --rows: 3;          /* Nombre de lignes */
            --gap: 15px;        /* Espace entre les vignettes */
            /* Taille carrée basée sur la hauteur de l'écran */
            --cell-size: calc((100vh - (var(--gap) * (var(--rows) + 1))) / var(--rows));
        }

        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            background: #000;
            overflow: hidden; /* Bloque le scroll de la page entière */
            touch-action: none; /* Crucial : empêche le navigateur de gérer le tactile */
        }

        /* GRILLE HORIZONTALE */
        #gallery {
            display: grid;
            grid-template-rows: repeat(var(--rows), var(--cell-size));
            grid-auto-flow: column;
            grid-auto-columns: var(--cell-size);
            gap: var(--gap);
            padding: var(--gap);
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            
            overflow-x: auto;
            overflow-y: hidden;
            
            cursor: grab;
            scrollbar-width: none; /* Firefox */
        }
        #gallery::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        /* VIGNETTES CARRÉES */
        .vignette {
            width: var(--cell-size);
            height: var(--cell-size);
            background: #111;
            overflow: hidden;
            user-select: none;
        }

        .vignette img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Recadre en carré proprement */
            pointer-events: none; /* Évite de "sortir" l'image au drag */
            transition: transform 0.2s;
        }

        /* LIGHTBOX */
        #lightbox {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; cursor: pointer;
        }
        #lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="gallery"></div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img src="" alt="">
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lbImg = lightbox.querySelector('img');

        let isDown = false;
        let startX;
        let scrollLeft;
        let velocity = 0;
        let lastPosX = 0;
        let rafId;

        // 1. CHARGEMENT
        async function load() {
            try {
                const res = await fetch('images.json');
                const images = await res.json();
                images.forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'vignette';
                    div.innerHTML = `<img src="vignettes/${name}" data-full="images/${name}">`;
                    
                    div.addEventListener('click', () => {
                        // On n'ouvre que si on ne swipe pas
                        if (Math.abs(velocity) < 2) {
                            lbImg.src = div.querySelector('img').dataset.full;
                            lightbox.style.display = 'flex';
                        }
                    });
                    gallery.appendChild(div);
                });
            } catch(e) { console.error(e); }
        }

        // 2. LOGIQUE DE SWIPE HORIZONTAL (SOURIS & TACTILE)
        const start = (e) => {
            isDown = true;
            gallery.style.cursor = 'grabbing';
            const x = e.pageX || e.touches[0].pageX;
            startX = x - gallery.offsetLeft;
            scrollLeft = gallery.scrollLeft;
            velocity = 0;
            cancelAnimationFrame(rafId);
        };

        const move = (e) => {
            if (!isDown) return;
            e.preventDefault(); 
            const x = e.pageX || e.touches[0].pageX;
            const walk = (x - gallery.offsetLeft) - startX;
            
            // Calcul de la vitesse pour l'inertie (basé sur l'axe X)
            velocity = x - lastPosX;
            lastPosX = x;

            gallery.scrollLeft = scrollLeft - walk;
        };

        const end = () => {
            isDown = false;
            gallery.style.cursor = 'grab';
            applyInertia();
        };

        // 3. INERTIE ET AIMANTATION (SNAP)
        function applyInertia() {
            if (Math.abs(velocity) > 0.5) {
                gallery.scrollLeft -= velocity;
                velocity *= 0.95; // Friction
                rafId = requestAnimationFrame(applyInertia);
            } else {
                snap();
            }
        }

        function snap() {
            // Calcule la largeur d'une cellule + le gap pour s'aimanter pile au bord
            const cellSize = gallery.querySelector('.vignette').offsetWidth + parseInt(getComputedStyle(gallery).gap);
            const target = Math.round(gallery.scrollLeft / cellSize) * cellSize;
            gallery.scrollTo({ left: target, behavior: 'smooth' });
        }

        // ÉVÉNEMENTS SOURIS
        gallery.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);

        // ÉVÉNEMENTS TACTILES
        gallery.addEventListener('touchstart', start, {passive: false});
        gallery.addEventListener('touchmove', move, {passive: false});
        gallery.addEventListener('touchend', end);

        // TRACKPAD / MOLETTE (Adaptation intelligente)
        gallery.addEventListener('wheel', (e) => {
            cancelAnimationFrame(rafId);
            // Si l'utilisateur utilise un trackpad (deltaX présent) ou une molette (deltaY)
            // On défile toujours horizontalement
            if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                // Scroll horizontal naturel (Trackpad)
                gallery.scrollLeft += e.deltaX;
            } else {
                // Molette verticale forcée en horizontal
                gallery.scrollLeft += e.deltaY;
            }
            
            e.preventDefault();
            clearTimeout(window.snapTimer);
            window.snapTimer = setTimeout(snap, 150);
        }, {passive: false});

        load();
    </script>
</body>
</html>
