<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaïque Fluide Haute Performance</title>
    <style>
        :root {
            --rows: 3;
            --imgs-per-column: 4; 
            --gap: 15px;
            --bg-color: #050505;
        }

        body {
            margin: 0; background: var(--bg-color); color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
            overflow: hidden;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .gallery-wrapper {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* --- LA MOSAÏQUE (Scroll Natif + Inertie) --- */
        .mosaic-container {
            display: grid;
            grid-template-rows: repeat(var(--rows), 1fr);
            grid-auto-flow: column;
            /* On calcule la taille pour que l'image soit carrée par rapport à la hauteur dispo */
            grid-auto-columns: calc((90vh / var(--rows)) - var(--gap));
            
            gap: var(--gap);
            height: 90vh;
            padding: 0 10vw; /* Marge de début et de fin */
            
            overflow-x: scroll;
            overflow-y: hidden;
            
            /* Pour mobile et trackpad Mac : active l'inertie native */
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity; /* "Aimante" légèrement les images */
            
            /* Cacher la scrollbar */
            scrollbar-width: none; 
            cursor: grab;
            user-select: none;
        }

        .mosaic-container::-webkit-scrollbar { display: none; }

        .mosaic-item {
            scroll-snap-align: start;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            overflow: hidden;
            background: #1a1a1a;
            transition: transform 0.2s;
        }

        .mosaic-item:hover { transform: scale(1.02); }

        .mosaic-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Lightbox */
        #lightbox {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(5px);
        }
        #lightbox img { 
            max-width: 90%; max-height: 90%; 
            object-fit: contain; 
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Boutons discrets */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.05); border: none; color: white;
            padding: 20px 10px; cursor: pointer; z-index: 10; border-radius: 10px;
        }
        .next-btn { right: 10px; }
        .prev-btn { left: 10px; }
    </style>
</head>
<body>

    <div class="gallery-wrapper">
        <button class="nav-btn prev-btn" onclick="sideScroll(-500)">❮</button>
        <div class="mosaic-container" id="gallery"></div>
        <button class="nav-btn next-btn" onclick="sideScroll(500)">❯</button>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');

        // Chargement des images
        async function loadImages() {
            try {
                const response = await fetch('images.json');
                const images = await response.json();
                
                images.forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'mosaic-item';
                    
                    // On affiche la VIGNETTE dans la mosaïque
                    div.innerHTML = `<img src="vignettes/${name}" loading="lazy" alt="">`;
                    
                    // Au clic, on ouvre l'image HD
                    div.onclick = () => { 
                        if(!isScrolling) openLightbox(`hd/${name}`); 
                    };
                    
                    gallery.appendChild(div);
                });
            } catch(e) { console.error("Erreur de chargement"); }
        }


        // --- LOGIQUE DE SWIPE FLUIDE (MOUVEMENT AVEC INERTIE) ---
        let isDown = false;
        let startX;
        let scrollLeft;
        let velocity = 0;
        let isScrolling = false;
        let lastPosX = 0;

        gallery.addEventListener('mousedown', (e) => {
            isDown = true;
            gallery.style.cursor = 'grabbing';
            startX = e.pageX - gallery.offsetLeft;
            scrollLeft = gallery.scrollLeft;
            velocity = 0;
            isScrolling = false;
        });

        gallery.addEventListener('mouseleave', () => { isDown = false; });
        gallery.addEventListener('mouseup', () => { 
            isDown = false;
            gallery.style.cursor = 'grab';
            // On laisse l'inertie continuer
            requestAnimationFrame(applyInertia);
        });

        gallery.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - gallery.offsetLeft;
            const walk = (x - startX);
            
            // Calcul de la vélocité pour l'inertie
            velocity = x - lastPosX;
            lastPosX = x;

            if (Math.abs(walk) > 10) isScrolling = true;
            gallery.scrollLeft = scrollLeft - walk;
        });

        function applyInertia() {
            if (isDown || Math.abs(velocity) < 0.5) return;
            gallery.scrollLeft -= velocity;
            velocity *= 0.95; // Friction : plus le chiffre est haut, plus ça glisse longtemps
            requestAnimationFrame(applyInertia);
        }

        // Support Trackpad & Molette (Inertie native)
        gallery.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                // Transforme le scroll vertical de la molette en horizontal
                gallery.scrollLeft += e.deltaY;
            }
        });

        function sideScroll(amount) {
            gallery.scrollBy({ left: amount, behavior: 'smooth' });
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            lightbox.style.display = 'flex';
        }

        loadImages();
    </script>
</body>
</html>
